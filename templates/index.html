<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Our Beloved Family</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lora:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-background">
        <div class="content-container">
            <header>
                <div class="title-frame">
                    <h1>Meet Our Beloved Family</h1>
                </div>
                <p class="tagline">The garden of pets we love</p>
            </header>

            <main class="pet-grid">
                {% for pet in pets %}
                <div class="animal-card">
                    <a href="{{ url_for('pet_detail', slug=pet.slug) }}">
                        <div class="photo-frame">
                            <img src="{{ pet.headshot_url }}" alt="{{ pet.name }}">
                            <div class="bio-overlay">
                                {{ pet.bio }}
                                <span class="bio-hint">Read more →</span>
                            </div>
                        </div>
                        <p class="animal-name">{{ pet.name }}</p>
                    </a>
                </div>
                {% endfor %}
            </main>
        </div>
    </div>

    <script>
        window.addEventListener("DOMContentLoaded", () => {
            const title = document.querySelector(".title-frame");
            const cards = document.querySelectorAll(".animal-card");
            title.classList.add("fade-in");
            cards.forEach((card, i) => {
                setTimeout(() => card.classList.add("fade-in"), 600 + i * 250);
            });
        });
    </script>
</body>
</html>
