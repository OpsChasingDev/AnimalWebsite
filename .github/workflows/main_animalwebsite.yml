# Build and deploy Python app to Azure App Service.
# - Push to staging  → deploys to STAGING  (animalwebsite-staging)
# - Push to main     → deploys to PRODUCTION (animalwebsite)
#
# Skills /deploy-staging and /deploy-prod orchestrate the merges that produce
# these pushes. Workflow can also be triggered manually via workflow_dispatch.

name: Build and deploy AnimalWebsite

on:
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC federated auth to Azure
  contents: read    # required for actions/checkout

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip . \
            -x "venv/*" "*.git*" "__pycache__/*" "*.DS_Store" "*.pyc"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Staging
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C12C6879BE7F4E768370E034E10D5D84 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_915C2F662EB14712A18D53F84B6C1763 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3C35A39C0C1247C4A43B345A275A1C80 }}

      - name: Deploy to staging
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: animalwebsite-staging

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C12C6879BE7F4E768370E034E10D5D84 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_915C2F662EB14712A18D53F84B6C1763 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3C35A39C0C1247C4A43B345A275A1C80 }}

      - name: Deploy to production
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: animalwebsite
          slot-name: Production
